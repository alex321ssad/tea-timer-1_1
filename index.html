<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Victorian Tea Timer</title>


<style>
    body {
        font-family: Georgia, "Times New Roman", serif;
        background: radial-gradient(circle at center, #3b3025 0%, #17130f 100%);
        color: #f5e6c8;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
    }

    .timer-container {
        background: #211b16;
        padding: 30px;
        border-radius: 18px;
        border: 3px double #c9a45c;
        box-shadow: 0 12px 35px rgba(0,0,0,0.55);
        text-align: center;
        max-width: 420px;
        width: calc(100% - 40px);
    }

    h1 {
        color: #d8b76a;
        margin-top: 0;
        font-size: 1.9rem;
    }

    .maid-image {
        width: 100%;
        max-width: 330px;
        border-radius: 12px;
        border: 2px solid #c9a45c;
        margin-bottom: 20px;
    }

    h2 {
        color: #e8d2a5;
        font-size: 1.1rem;
        font-weight: normal;
        margin: 18px 0;
    }

    .preset-buttons {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-bottom: 18px;
    }

    button {
        padding: 12px 8px;
        border: 1px solid #b8944d;
        border-radius: 8px;
        cursor: pointer;
        font-family: Georgia, "Times New Roman", serif;
        font-weight: bold;
        transition: all 0.2s ease;
    }

    .preset-btn {
        background: #3a3025;
        color: #e8d2a5;
    }

    .preset-btn:hover {
        background: #514332;
        transform: translateY(-1px);
    }

    .custom-section {
        margin: 18px 0 20px;
        padding: 16px;
        border-top: 1px solid #705c3d;
        border-bottom: 1px solid #705c3d;
    }

    .custom-title {
        margin: 0 0 12px;
        color: #d8b76a;
        font-size: 1rem;
    }

    .custom-inputs {
        display: flex;
        gap: 10px;
        justify-content: center;
        align-items: center;
    }

    .custom-inputs input {
        width: 85px;
        box-sizing: border-box;
        padding: 11px 8px;
        border-radius: 7px;
        border: 1px solid #b8944d;
        background: #17130f;
        color: #f5e6c8;
        text-align: center;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1rem;
    }

    .custom-inputs input:focus {
        outline: 2px solid #c9a45c;
    }

    .custom-inputs span {
        color: #d8b76a;
        font-size: 1.2rem;
    }

    .set-custom-btn {
        margin-top: 12px;
        width: 100%;
        background: #5a4930;
        color: #f5e6c8;
    }

    .set-custom-btn:hover {
        background: #705b3b;
    }

    .display {
        font-size: 3.5rem;
        font-weight: bold;
        margin: 20px 0;
        font-family: monospace;
        color: #f5e6c8;
        letter-spacing: 2px;
    }

    .controls {
        display: flex;
        justify-content: space-between;
        gap: 10px;
    }

    .controls button {
        flex: 1;
        font-size: 1rem;
        padding: 12px 0;
        color: white;
        border: none;
    }

    .start-btn {
        background: #567044;
    }

    .start-btn:hover {
        background: #668553;
    }

    .stop-btn {
        background: #8b4b3f;
    }

    .stop-btn:hover {
        background: #a1584a;
    }

    .reset-btn {
        background: #66605a;
    }

    .reset-btn:hover {
        background: #77716b;
    }

    @media (max-width: 480px) {
        .timer-container {
            padding: 22px;
            width: calc(100% - 30px);
        }

        .preset-buttons {
            grid-template-columns: 1fr;
        }

        .display {
            font-size: 2.8rem;
        }
    }
</style>


</head>

<body>

<div class="timer-container">


<h1>🍵 Victorian Tea Timer</h1>

<img
    src="maid.jpg"
    alt="Victorian maid preparing tea"
    class="maid-image"
>

<div class="preset-buttons">
    <button class="preset-btn" onclick="setTimer(180, 'Green Tea')">
        Green<br>3 min
    </button>

    <button class="preset-btn" onclick="setTimer(240, 'Black Tea')">
        Black<br>4 min
    </button>

    <button class="preset-btn" onclick="setTimer(300, 'Herbal Tea')">
        Herbal<br>5 min
    </button>
</div>

<div class="custom-section">
    <p class="custom-title">⏳ Set Your Own Time</p>

    <div class="custom-inputs">
        <input
            type="number"
            id="custom-minutes"
            min="0"
            max="999"
            value="10"
            aria-label="Minutes"
        >

        <span>:</span>

        <input
            type="number"
            id="custom-seconds"
            min="0"
            max="59"
            value="0"
            aria-label="Seconds"
        >
    </div>

    <button class="set-custom-btn" onclick="setCustomTimer()">
        Set Custom Time
    </button>
</div>

<h2 id="tea-type">Select a tea preset</h2>

<div class="display" id="time-display">00:00</div>

<div class="controls">
    <button class="start-btn" onclick="startTimer()">Start</button>
    <button class="stop-btn" onclick="stopTimer()">Pause</button>
    <button class="reset-btn" onclick="resetTimer()">Reset</button>
</div>


</div>

<audio
 id="teaReadyAudio"
 src="lord-lady-tea-is-ready.mp3"
 preload="auto"> </audio>

<script>
    let countdown;
    let timeLeft = 0;
    let isRunning = false;

    const teaReadyAudio = document.getElementById("teaReadyAudio");

    function setTimer(seconds, type) {
        clearInterval(countdown);
        isRunning = false;
        timeLeft = seconds;

        document.getElementById("tea-type").innerText = type;
        updateDisplay();
    }

    
function setCustomTimer() {
clearInterval(countdown);
isRunning = false;

const minutesInput = document.getElementById("custom-minutes");
const secondsInput = document.getElementById("custom-seconds");

let minutes = parseInt(minutesInput.value, 10) || 0;
let seconds = parseInt(secondsInput.value, 10) || 0;

minutes = Math.max(0, minutes);
seconds = Math.max(0, Math.min(59, seconds));

minutesInput.value = minutes;
secondsInput.value = seconds;

timeLeft = minutes * 60 + seconds;

if (timeLeft <= 0) {
    document.getElementById("tea-type").innerText =
        "Please choose a time greater than 0.";
    updateDisplay();
    return;
}

document.getElementById("tea-type").innerText =
    "Custom Tea Timer";

updateDisplay();

}
      
    function updateDisplay() {
        const mins = Math.floor(timeLeft / 60);
        const secs = timeLeft % 60;

        document.getElementById("time-display").innerText =
            `${mins.toString().padStart(2, "0")}:${secs.toString().padStart(2, "0")}`;
    }

    function startTimer() {
        if (isRunning || timeLeft <= 0) {
            return;
        }

        isRunning = true;

        // Helps browsers allow the audio after a user click.
        teaReadyAudio.muted = true;

        teaReadyAudio.play()
            .then(() => {
                teaReadyAudio.pause();
                teaReadyAudio.currentTime = 0;
                teaReadyAudio.muted = false;
            })
            .catch(() => {
                teaReadyAudio.muted = false;
            });

        countdown = setInterval(() => {
            timeLeft--;
            updateDisplay();

            if (timeLeft <= 0) {
                clearInterval(countdown);
                isRunning = false;

                playTeaReady();

                document.getElementById("tea-type").innerText =
                    "✨ Your Tea is Ready! ✨";
            }
        }, 1000);
    }

    function stopTimer() {
        clearInterval(countdown);
        isRunning = false;
    }

    function resetTimer() {
        clearInterval(countdown);
        isRunning = false;
        timeLeft = 0;

        document.getElementById("tea-type").innerText =
            "Select a tea preset";

        document.getElementById("time-display").innerText =
            "00:00";
    }

    function playTeaReady() {
        teaReadyAudio.currentTime = 0;
        teaReadyAudio.muted = false;

        teaReadyAudio.play().catch(() => {
            console.log("Audio playback was blocked by the browser.");
        });
    }
</script>

</body>
</html>
