<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Tea Timer</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f7f8;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .timer-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 380px;
            width: 100%;
        }
        h1 { color: #2e7d32; margin-top: 0; font-size: 1.8rem; }
        h2 { color: #555; font-size: 1.1rem; font-weight: 500; margin: 15px 0; }
        .preset-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }
        button {
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .preset-btn { background: #e8f5e9; color: #2e7d32; font-size: 0.9rem; }
        .preset-btn:hover { background: #c8e6c9; transform: translateY(-1px); }
        .display {
            font-size: 3.5rem;
            font-weight: 700;
            margin: 20px 0;
            font-family: monospace;
            color: #111;
            letter-spacing: 2px;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }
        .controls button { flex: 1; font-size: 1rem; padding: 12px 0; color: white; }
        .start-btn { background: #4caf50; }
        .start-btn:hover { background: #43a047; }
        .stop-btn { background: #f44336; }
        .stop-btn:hover { background: #e53935; }
        .reset-btn { background: #757575; }
        .reset-btn:hover { background: #616161; }
    </style>
</head>
<body>

<div class="timer-container">
    <h1>🍵 Free Tea Timer</h1>
    
    <div class="preset-buttons">
        <button class="preset-btn" onclick="setTimer(180, 'Green Tea')">Green<br>3 min</button>
        <button class="preset-btn" onclick="setTimer(240, 'Black Tea')">Black<br>4 min</button>
        <button class="preset-btn" onclick="setTimer(300, 'Herbal Tea')">Herbal<br>5 min</button>
    </div>
    
    <h2 id="tea-type">Select a tea preset</h2>
    <div class="display" id="time-display">00:00</div>
    
    <div class="controls">
        <button class="start-btn" onclick="startTimer()">Start</button>
        <button class="stop-btn" onclick="stopTimer()">Pause</button>
        <button class="reset-btn" onclick="resetTimer()">Reset</button>
    </div>
</div>

<script>
    let countdown;
    let timeLeft = 0;
    let isRunning = false;
    let audioCtx = null;

    function setTimer(seconds, type) {
        clearInterval(countdown);
        isRunning = false;
        timeLeft = seconds;
        document.getElementById('tea-type').innerText = type;
        updateDisplay();
    }

    function updateDisplay() {
        const mins = Math.floor(timeLeft / 60);
        const secs = timeLeft % 60;
        document.getElementById('time-display').innerText = 
            `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function startTimer() {
        if (isRunning || timeLeft <= 0) return;
        isRunning = true;
        
        // Initialize Web Audio Context safely on user click to bypass browser blocks
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        countdown = setInterval(() => {
            timeLeft--;
            updateDisplay();

            if (timeLeft <= 0) {
                clearInterval(countdown);
                isRunning = false;
                playAlarm();
                document.getElementById('tea-type').innerText = "✨ Your Tea is Ready! ✨";
            }
        }, 1000);
    }

    function stopTimer() {
        clearInterval(countdown);
        isRunning = false;
    }

    function resetTimer() {
        clearInterval(countdown);
        isRunning = false;
        timeLeft = 0;
        document.getElementById('tea-type').innerText = "Select a tea preset";
        document.getElementById('time-display').innerText = "00:00";
    }

    function playAlarm() {
        if (!audioCtx) return;
        
        // Simple synthetic chime sound (no external dependencies or audio files required)
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime); // A5 note
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        
        osc.start();
        // Ring for 600 milliseconds
        setTimeout(() => osc.stop(), 600);
    }
</script>

</body>
</html>
